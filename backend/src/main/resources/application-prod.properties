# Production Profile Configuration
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
cookie.secure=${COOKIE_SECURE:true}

# Strict production datasource binding
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Production secret binding
jwt.secret=${JWT_SECRET:${JWT_SECERT}}
jwt.expiration=${JWT_EXPIRATION:${JWT_EXP:3600000}}

razorpay.key_id=${RAZORPAY_KEY_ID:${RAZORPAY_ID:dummy-razorpay-key}}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECERT:dummy-razorpay-secret}}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${GOOGLE_ID:dummy-google-client-id.apps.googleusercontent.com}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${GOOGLE_SECRET:dummy-google-client-secret}}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
