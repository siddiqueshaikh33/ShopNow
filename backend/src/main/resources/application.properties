spring.application.name=ShopNowBackend
server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopnow}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:pass123}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Supports standard JWT_SECRET and legacy JWT_SECERT)
jwt.secret=${JWT_SECRET:${JWT_SECERT:your-long-production-jwt-secret-code-user-to-authenticate-by-creating-jwt-token-12345678901234567890}}
jwt.expiration=${JWT_EXPIRATION:${JWT_EXP:3600000}}

# Cookie Security (false for local HTTP, true for production HTTPS)
cookie.secure=${COOKIE_SECURE:false}

# Razorpay Credentials (Supports standard RAZORPAY_KEY_ID/SECRET and legacy IDs)
razorpay.key_id=${RAZORPAY_KEY_ID:${RAZORPAY_ID:rzp_test_S2U9gv9j73J8pb}}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECERT:fw8VzYtunqfnfN3R90FMCBHx}}

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${GOOGLE_ID:your-google-client-id.apps.googleusercontent.com}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${GOOGLE_SECRET:your-google-client-secret}}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Rate Limiting Configuration
ratelimit.strict.ip.capacity=${RATELIMIT_STRICT_IP_CAPACITY:5}
ratelimit.strict.ip.duration-minutes=${RATELIMIT_STRICT_IP_DURATION:1}
ratelimit.general.ip.capacity=${RATELIMIT_GENERAL_IP_CAPACITY:100}
ratelimit.general.ip.duration-minutes=${RATELIMIT_GENERAL_IP_DURATION:1}
ratelimit.username.capacity=${RATELIMIT_USERNAME_CAPACITY:5}
ratelimit.username.duration-minutes=${RATELIMIT_USERNAME_DURATION:15}
