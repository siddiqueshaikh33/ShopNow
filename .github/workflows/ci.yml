name: ShopNow CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI (Java 17 + Spring Boot)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pass123
          MYSQL_DATABASE: shopnow
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: Run Backend Unit & Integration Tests (87 Tests)
        run: ./mvnw clean verify -B
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/shopnow
          DB_USER: root
          DB_PASSWORD: pass123
          SPRING_PROFILES_ACTIVE: local

  frontend-ci:
    name: Frontend CI (React 19 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/ShopNow_Frontend/SN_Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/ShopNow_Frontend/SN_Frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend/ShopNow_Frontend/SN_Frontend

      - name: Build Frontend Application
        run: npm run build
        working-directory: frontend/ShopNow_Frontend/SN_Frontend
